<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Painel do admin | Cursonalta</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .adm { --ink:#141414; --orange:#d9480f; --bg:#f6f5f2; --line:#e7e4de; --muted:#6b6b6b; background:var(--bg); min-height:80vh; padding:24px 0 96px; color:var(--ink); }
    .adm * { box-sizing:border-box; }
    .adm-bar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:12px; margin-bottom:18px; }
    .adm h1 { margin:0; font-size:1.5rem; }
    .adm-actions-top { display:flex; flex-wrap:wrap; gap:8px; }
    .adm-tabs { display:flex; gap:6px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; }
    .adm-tab { background:none; border:0; border-bottom:3px solid transparent; padding:10px 14px; font:inherit; font-weight:600; color:var(--muted); cursor:pointer; white-space:nowrap; }
    .adm-tab.on { color:var(--ink); border-bottom-color:var(--orange); }
    .adm-msg { min-height:1.2em; font-weight:600; margin:0 0 14px; font-size:.95rem; }
    .adm-msg.ok { color:#1f7a3a; }
    .adm-msg.err { color:#b91c1c; }
    .adm-card { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; min-width:0; }
    .adm-search { width:100%; font:inherit; padding:11px 14px; border:1px solid #cfcac2; border-radius:12px; background:#fff; margin-bottom:16px; }
    .adm-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
    .adm-item { text-align:left; background:#fff; border:1px solid var(--line); border-radius:14px; padding:0; overflow:hidden; cursor:pointer; font:inherit; color:var(--ink); display:flex; flex-direction:column; }
    .adm-item:hover { border-color:#cfcac2; }
    .adm-item .thumb { width:100%; aspect-ratio:16/10; background:#141414 center/cover no-repeat; }
    .adm-item .body { padding:12px 14px 14px; display:grid; gap:4px; }
    .adm-item strong { font-size:.98rem; line-height:1.25; }
    .adm-item small { color:var(--muted); font-size:.8rem; }
    .adm-empty { color:var(--muted); padding:24px 0; text-align:center; }
    .adm-back { margin-bottom:14px; }
    .adm-sec { border:1px solid var(--line); border-radius:14px; padding:18px; margin-bottom:14px; background:#fff; }
    .adm-sec h2 { font-size:1rem; margin:0 0 14px; }
    .adm-grid2 { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px; }
    .adm-field { display:grid; gap:6px; min-width:0; }
    .adm-field.full { grid-column:1 / -1; }
    .adm-field label { font-size:.85rem; font-weight:600; }
    .adm-field input, .adm-field textarea, .adm-field select { font:inherit; padding:10px 12px; border:1px solid #cfcac2; border-radius:10px; background:#fff; color:var(--ink); width:100%; min-width:0; }
    .adm-field input:disabled { background:#f3f1ed; color:var(--muted); }
    .adm-field textarea { min-height:90px; resize:vertical; }
    .adm-field small { color:var(--muted); font-size:.78rem; }
    .adm-footbar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--line); padding:12px 16px; display:flex; flex-wrap:wrap; gap:10px; justify-content:space-between; z-index:20; }
    .adm-footbar .grp { display:flex; gap:10px; flex-wrap:wrap; }
    .adm-danger { color:#b91c1c; border-color:#e0b4b4; }
    .adm-restricted { max-width:520px; margin:60px auto; text-align:center; }
    .adm-access { max-width:560px; }
    .adm-kpis { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-bottom:18px; }
    .adm-kpi { background:#fff; border:1px solid var(--line); border-radius:14px; padding:14px 16px; }
    .adm-kpi span { display:block; color:var(--muted); font-size:.8rem; font-weight:600; }
    .adm-kpi strong { display:block; font-size:1.35rem; margin-top:4px; }
    .adm-two { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
    .adm-table { width:100%; border-collapse:collapse; font-size:.9rem; }
    .adm-table th, .adm-table td { text-align:left; padding:9px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
    .adm-table th { color:var(--muted); font-size:.78rem; font-weight:600; }
    .adm-table td.num, .adm-table th.num { text-align:right; white-space:nowrap; }
    .adm-scroll { overflow-x:auto; }
    .adm-bar-row { display:grid; grid-template-columns:70px 1fr 110px; gap:10px; align-items:center; font-size:.85rem; padding:5px 0; }
    .adm-bar { background:#efece6; border-radius:6px; height:14px; overflow:hidden; }
    .adm-bar i { display:block; height:100%; background:var(--orange); border-radius:6px; }
    .adm-note { background:#fff7ed; border:1px solid #fed7aa; color:#9a3412; border-radius:12px; padding:12px 14px; margin-bottom:16px; font-size:.9rem; }
    .adm-pill { display:inline-block; font-size:.75rem; font-weight:600; padding:2px 8px; border-radius:99px; background:#efece6; }
    .adm-pill.ok { background:#dcfce7; color:#166534; }
    .adm-pill.warn { background:#fef3c7; color:#92400e; }
    @media (max-width: 700px) {
      .adm-two { grid-template-columns:1fr; }
      .adm-bar-row { grid-template-columns:60px 1fr 96px; }
      .adm-grid2 { grid-template-columns:1fr; }
      .adm-grid { grid-template-columns:1fr 1fr; gap:10px; }
      .adm h1 { font-size:1.3rem; }
      .adm-sec { padding:14px; }
    }
    @media (max-width: 460px) {
      .adm-grid { grid-template-columns:1fr; }
      .adm-footbar .grp { width:100%; }
      .adm-footbar .btn { flex:1; }
    }
  </style>
</head>
<body>

<header class="site-header">
  <nav class="container nav">
    <a href="index.html" class="brand" aria-label="Cursonalta início">
      <img src="assets/logo.png" alt="Logo Cursonalta">
      <span>Curso<b>nalta</b></span>
    </a>
    <div class="nav-links" id="nav-links">
      <a href="index.html">Início</a>
      <a href="cursos.html">Cursos</a>
    </div>
    <div class="nav-actions">
      <a href="minha-area.html" class="btn btn-ghost btn-sm">Minha área</a>
      <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menu">☰</button>
    </div>
  </nav>
</header>

<main class="adm">
  <div class="container" id="adm-root">
    <p>Carregando...</p>
  </div>
</main>

<script src="js/courses.js"></script>
<script src="js/main.js"></script>
<script src="js/drt-popup.js"></script>
<script>
(function () {
  var root = document.getElementById("adm-root");
  var courses = [];
  var selected = -1;      // índice do curso em edição
  var isNew = false;      // criando um curso novo
  var tab = "painel";     // "painel", "cursos", "alunos" ou "acesso"
  var query = "";         // busca na lista de cursos

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function slugify(s) {
    return String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase()
      .replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60);
  }

  function initialsOf(name) {
    return String(name || "").trim().split(/\s+/).slice(0, 2)
      .map(function (p) { return p.charAt(0).toUpperCase(); }).join("");
  }

  function blank() {
    return {
      id: "", title: "", shortDescription: "", description: "", category: "", level: "Todos os níveis",
      instructor: { name: "", role: "", initials: "" }, price: 14.99, duration: "", lessons: 0,
      cover: "", gradient: "linear-gradient(135deg, #141414, #2a2a2a)", learn: [], modules: []
    };
  }

  function msg(text, kind) {
    var el = document.getElementById("adm-msg");
    if (!el) return;
    el.textContent = text || "";
    el.className = "adm-msg " + (kind || "");
  }

  function coverStyle(c) {
    return c.cover ? "background-image:url('" + esc(c.cover) + "')" : "";
  }

  function listHTML() {
    var q = query.trim().toLowerCase();
    var items = courses.map(function (c, i) { return { c: c, i: i }; }).filter(function (x) {
      if (!q) return true;
      return (x.c.title + " " + x.c.category).toLowerCase().indexOf(q) !== -1;
    });
    if (!courses.length) return '<p class="adm-empty">Nenhum curso ainda. Clique em "Novo curso" para começar.</p>';
    if (!items.length) return '<p class="adm-empty">Nenhum curso encontrado para "' + esc(query) + '".</p>';
    return '<div class="adm-grid">' + items.map(function (x) {
      var c = x.c;
      return '<button type="button" class="adm-item" data-i="' + x.i + '">' +
               '<div class="thumb" style="' + coverStyle(c) + '"></div>' +
               '<div class="body"><strong>' + esc(c.title || "(sem título)") + '</strong>' +
               '<small>' + esc(c.category || "Sem categoria") + '</small></div>' +
             "</button>";
    }).join("") + "</div>";
  }

  function formHTML(c) {
    var modules = (c.modules || []).map(function (m) { return m.title + " | " + m.lessons + " | " + m.time; }).join("\n");
    var learn = (c.learn || []).join("\n");
    return '' +
      '<section class="adm-sec"><h2>Informações do curso</h2><div class="adm-grid2">' +
        '<div class="adm-field full"><label for="f-title">Título</label><input id="f-title" value="' + esc(c.title) + '"></div>' +
        '<div class="adm-field"><label for="f-id">Identificador (link do curso)</label>' +
          '<input id="f-id" value="' + esc(c.id) + '" ' + (isNew ? "" : "disabled") + '>' +
          '<small>' + (isNew ? "Gerado pelo título. Só letras minúsculas, números e hífen." : "Não muda depois de criado.") + '</small></div>' +
        '<div class="adm-field"><label for="f-category">Categoria</label><input id="f-category" value="' + esc(c.category) + '" placeholder="Ex.: Marketing"></div>' +
        '<div class="adm-field"><label for="f-level">Nível</label><input id="f-level" value="' + esc(c.level) + '" placeholder="Ex.: Iniciante"></div>' +
        '<div class="adm-field"><label for="f-price">Preço (R$, pagamento único)</label><input id="f-price" type="number" step="0.01" min="0" value="' + esc(c.price) + '"></div>' +
        '<div class="adm-field"><label for="f-duration">Duração total</label><input id="f-duration" value="' + esc(c.duration) + '" placeholder="Ex.: 12h 30min"></div>' +
        '<div class="adm-field"><label for="f-lessons">Número de aulas</label><input id="f-lessons" type="number" min="0" value="' + esc(c.lessons) + '"></div>' +
        '<div class="adm-field full"><label for="f-telegram">Link do grupo no Telegram</label><input id="f-telegram" value="' + esc(c.telegram || "") + '" placeholder="https://t.me/seugrupo"><small>Aparece para o aluno que tem acesso ao curso.</small></div>' +
      '</div></section>' +

      '<section class="adm-sec"><h2>Capa</h2>' +
        '<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">' +
          '<img id="f-preview" alt="" src="' + esc(c.cover ? c.cover : "") + '" style="width:160px;aspect-ratio:16/10;object-fit:cover;border-radius:10px;background:#141414;' + (c.cover ? "" : "display:none;") + '">' +
          '<div style="display:grid;gap:8px;flex:1;min-width:220px">' +
            '<input type="file" id="f-file" accept="image/jpeg,image/png,image/webp">' +
            '<button type="button" class="btn btn-ghost btn-sm" id="btn-upload" style="justify-self:start">Enviar imagem da capa</button>' +
            '<small id="f-cover-msg" style="color:var(--muted)">JPG, PNG ou WebP, até 4 MB. Recomendado 1600 x 1000 px.</small>' +
          '</div>' +
        '</div>' +
        '<input id="f-cover" type="hidden" value="' + esc(c.cover) + '">' +
      '</section>' +

      '<section class="adm-sec"><h2>Textos</h2><div class="adm-grid2">' +
        '<div class="adm-field full"><label for="f-short">Descrição curta (aparece nos cartões)</label><textarea id="f-short" rows="2">' + esc(c.shortDescription) + '</textarea></div>' +
        '<div class="adm-field full"><label for="f-desc">Descrição completa</label><textarea id="f-desc" rows="4">' + esc(c.description) + '</textarea></div>' +
        '<div class="adm-field full"><label for="f-learn">O que o aluno vai aprender (um item por linha)</label><textarea id="f-learn" rows="4">' + esc(learn) + '</textarea></div>' +
      '</div></section>' +

      '<section class="adm-sec"><h2>Professor</h2><div class="adm-grid2">' +
        '<div class="adm-field"><label for="f-iname">Nome</label><input id="f-iname" value="' + esc(c.instructor.name) + '"></div>' +
        '<div class="adm-field"><label for="f-irole">Cargo</label><input id="f-irole" value="' + esc(c.instructor.role) + '"></div>' +
        '<div class="adm-field"><label for="f-iinit">Iniciais (2 letras)</label><input id="f-iinit" maxlength="3" value="' + esc(c.instructor.initials) + '"></div>' +
      '</div></section>' +

      '<section class="adm-sec"><h2>Módulos</h2>' +
        '<div class="adm-field"><label for="f-modules">Um módulo por linha: título | aulas | duração</label>' +
        '<textarea id="f-modules" rows="5" placeholder="Fundamentos | 6 | 1h 40min">' + esc(modules) + '</textarea></div>' +
      '</section>';
  }

  function accessHTML() {
    return '<div class="adm-card adm-access">' +
      '<h2 style="font-size:1.05rem;margin:0 0 6px">Liberar acesso de aluno</h2>' +
      '<p style="color:var(--muted);font-size:.9rem;margin:0 0 16px">A pessoa precisa ter conta com este e-mail. O acesso aparece na área dela na hora.</p>' +
      '<div style="display:grid;gap:14px">' +
        '<div class="adm-field"><label for="ac-email">E-mail do aluno</label><input id="ac-email" type="email" placeholder="aluno@email.com"></div>' +
        '<div class="adm-field"><label for="ac-plan">Plano</label><select id="ac-plan"><option value="curso">Um curso</option><option value="todos">Todos os cursos</option></select></div>' +
        '<div class="adm-field" id="ac-course-wrap"><label for="ac-course">Curso liberado</label><select id="ac-course">' +
          courses.map(function (c) { return '<option value="' + esc(c.id) + '">' + esc(c.title) + "</option>"; }).join("") +
        '</select></div>' +
        '<p id="ac-msg" class="adm-msg" role="status" style="margin:0"></p>' +
        '<button type="button" class="btn btn-primary" id="btn-access" style="justify-self:start">Liberar acesso</button>' +
      "</div></div>";
  }

  function editing() { return isNew || selected >= 0; }

  var stats = null;       // dados do painel (api/admin-stats.php)
  var statsErr = "";
  var alunoQ = "";

  function brl(n) { return "R$ " + Number(n || 0).toFixed(2).replace(".", ","); }

  function loadStats(then) {
    statsErr = "";
    fetch("api/admin-stats.php", { credentials: "same-origin" })
      .then(function (res) { return res.json().then(function (j) { return { status: res.status, body: j }; }); })
      .then(function (r) {
        if (r.body && r.body.ok) stats = r.body;
        else statsErr = (r.body && r.body.error) || "Não foi possível carregar o painel.";
        if (then) then();
        else render();
      })
      .catch(function () {
        statsErr = "Sem conexão com o servidor. Tente de novo.";
        if (then) then(); else render();
      });
  }

  function dashHTML() {
    if (!stats) {
      return '<div class="adm-card">' + (statsErr
        ? '<p class="adm-msg err" style="margin:0 0 12px">' + esc(statsErr) + '</p>'
        : '<p style="color:var(--muted);margin:0">Carregando o painel...</p>') +
        '<button type="button" class="btn btn-ghost btn-sm" id="dash-refresh" style="margin-top:10px">Tentar de novo</button></div>';
    }
    var k = stats.kpis;
    var kpi = function (label, value) { return '<div class="adm-kpi"><span>' + esc(label) + '</span><strong>' + value + '</strong></div>'; };
    var max = Math.max.apply(null, [1].concat(stats.months.map(function (m) { return m.amount; })));
    var bars = stats.months.map(function (m) {
      var pct = Math.round((m.amount / max) * 100);
      var lbl = m.m.split("-").reverse().join("/");
      return '<div class="adm-bar-row"><span>' + esc(lbl) + '</span><div class="adm-bar"><i style="width:' + pct + '%"></i></div><span style="text-align:right">' + brl(m.amount) + ' · ' + m.count + '</span></div>';
    }).join("");
    var courseRows = stats.courses.length ? stats.courses.map(function (c) {
      return '<tr><td>' + esc(c.title) + '</td><td class="num">' + brl(c.price) + '</td><td class="num">' + c.students + '</td><td class="num">' + c.sales + '</td></tr>';
    }).join("") : '<tr><td colspan="4" style="color:var(--muted)">Nenhum curso publicado.</td></tr>';
    var recentRows = stats.recent.length ? stats.recent.map(function (s) {
      var st = s.status === "approved" ? '<span class="adm-pill ok">aprovada</span>' : '<span class="adm-pill warn">' + esc(s.status) + '</span>';
      return '<tr><td>' + esc(s.date) + '</td><td>' + esc(s.email) + '</td><td>' + esc(s.item || s.type) + '</td><td class="num">' + brl(s.amount) + '</td><td>' + st + '</td></tr>';
    }).join("") : '<tr><td colspan="5" style="color:var(--muted)">Nenhuma venda encontrada.</td></tr>';
    var note = stats.sales.ok ? "" : '<div class="adm-note">' + esc(stats.sales.error || "Vendas indisponíveis.") + '</div>';

    return note +
      '<div class="adm-bar" style="margin-bottom:12px"><p style="margin:0;color:var(--muted);font-size:.85rem">Atualizado em ' + esc(stats.generatedAt) + '</p>' +
        '<button type="button" class="btn btn-ghost btn-sm" id="dash-refresh">Atualizar</button></div>' +
      '<div class="adm-kpis">' +
        kpi("Alunos cadastrados", k.students) +
        kpi("Assinantes ativos (todos os cursos)", k.todos_active) +
        kpi("Compraram curso avulso", k.curso_buyers) +
        kpi("Sem plano ativo", k.no_plan) +
        kpi("Vendas aprovadas", k.sales_count) +
        kpi("Receita total", brl(k.revenue_total)) +
        kpi("Receita 30 dias", brl(k.revenue_30d)) +
        kpi("Vendas 30 dias", k.sales_30d) +
        kpi("Cursos publicados", k.courses) +
        kpi("Reembolsos", k.refunds) +
      '</div>' +
      '<div class="adm-two">' +
        '<div class="adm-card"><h2 style="font-size:1rem;margin:0 0 10px">Faturamento dos últimos 6 meses</h2>' + bars + '</div>' +
        '<div class="adm-card"><h2 style="font-size:1rem;margin:0 0 10px">Cursos</h2><div class="adm-scroll"><table class="adm-table">' +
          '<tr><th>Curso</th><th class="num">Preço</th><th class="num">Alunos</th><th class="num">Vendas</th></tr>' + courseRows + '</table></div></div>' +
      '</div>' +
      '<div class="adm-card" style="margin-top:14px"><h2 style="font-size:1rem;margin:0 0 10px">Vendas recentes</h2><div class="adm-scroll"><table class="adm-table">' +
        '<tr><th>Data</th><th>Aluno</th><th>Item</th><th class="num">Valor</th><th>Situação</th></tr>' + recentRows + '</table></div></div>';
  }

  function alunosRowsHTML() {
    if (!stats) return '<p class="adm-empty">Carregando...</p>';
    var q = alunoQ.trim().toLowerCase();
    var list = stats.students.filter(function (s) {
      return !q || (s.name + " " + s.email).toLowerCase().indexOf(q) !== -1;
    });
    if (!list.length) return '<p class="adm-empty">Nenhum aluno encontrado.</p>';
    var planLabel = function (p) { return p === "todos" ? '<span class="adm-pill ok">Todos os cursos</span>' : p === "curso" ? '<span class="adm-pill">Cursos avulsos</span>' : '<span class="adm-pill warn">Sem plano</span>'; };
    return '<div class="adm-scroll"><table class="adm-table"><tr><th>Nome</th><th>E-mail</th><th>Plano</th><th>Vence</th><th class="num">Cursos</th><th>Cadastro</th></tr>' +
      list.map(function (s) {
        return '<tr><td>' + esc(s.name) + '</td><td>' + esc(s.email) + '</td><td>' + planLabel(s.plan) + '</td><td>' + esc(s.expires || "—") + '</td><td class="num">' + s.courses + '</td><td>' + esc((s.created || "").slice(0, 10)) + '</td></tr>';
      }).join("") + '</table></div>';
  }

  function alunosPanelHTML() {
    if (!stats) return dashHTML();
    return '<div class="adm-card">' +
      '<div class="adm-bar" style="margin-bottom:12px"><input id="al-q" class="adm-search" type="search" style="margin:0;max-width:420px" placeholder="Buscar aluno por nome ou e-mail" value="' + esc(alunoQ) + '"><span style="color:var(--muted);font-size:.85rem">' + stats.students.length + ' alunos</span></div>' +
      '<div id="al-list">' + alunosRowsHTML() + '</div></div>';
  }

  function render() {
    var tabs =
      '<div class="adm-tabs" role="tablist">' +
        '<button type="button" class="adm-tab' + (tab === "painel" ? " on" : "") + '" id="tab-painel">Painel</button>' +
        '<button type="button" class="adm-tab' + (tab === "cursos" ? " on" : "") + '" id="tab-cursos">Cursos</button>' +
        '<button type="button" class="adm-tab' + (tab === "alunos" ? " on" : "") + '" id="tab-alunos">Alunos</button>' +
        '<button type="button" class="adm-tab' + (tab === "acesso" ? " on" : "") + '" id="tab-acesso">Acesso</button>' +
      "</div>";

    var body;
    if (tab === "painel") {
      body = dashHTML();
    } else if (tab === "alunos") {
      body = alunosPanelHTML();
    } else if (tab === "acesso") {
      body = accessHTML();
    } else if (editing()) {
      body = '<button type="button" class="btn btn-ghost btn-sm adm-back" id="btn-cancel">← Voltar para a lista</button>' +
             formHTML(isNew ? blank() : courses[selected]);
    } else {
      body = '<div class="adm-card">' +
               '<input id="adm-q" class="adm-search" type="search" placeholder="Buscar curso pelo título ou categoria" value="' + esc(query) + '">' +
               '<div id="adm-list">' + listHTML() + "</div>" +
             "</div>";
    }

    var footer = "";
    if (tab === "cursos" && editing()) {
      footer = '<div class="adm-footbar">' +
        '<div class="grp">' +
          '<button type="button" class="btn btn-primary" id="btn-apply">Aplicar no curso</button>' +
          (isNew ? "" : '<button type="button" class="btn btn-ghost adm-danger" id="btn-delete">Excluir</button>') +
        '</div>' +
        '<div class="grp"><button type="button" class="btn btn-ghost" id="btn-cancel2">Cancelar</button></div>' +
      "</div>";
    }

    root.innerHTML =
      '<div class="adm-bar"><h1>Painel do admin</h1>' +
        '<div class="adm-actions-top">' +
          '<a class="btn btn-ghost btn-sm" href="admin-config.html">Integrações</a>' +
          '<button type="button" class="btn btn-ghost btn-sm" id="btn-new">Novo curso</button>' +
          '<button type="button" class="btn btn-primary btn-sm" id="btn-save">Salvar no site</button>' +
        '</div></div>' +
      '<p id="adm-msg" class="adm-msg" role="status"></p>' +
      tabs + body + footer;
    bind();
  }

  // Monta o curso a partir do formulário
  function readForm() {
    var v = function (id) { return document.getElementById(id).value; };
    var learn = v("f-learn").split("\n").map(function (s) { return s.trim(); }).filter(Boolean);
    var modules = v("f-modules").split("\n").map(function (line) {
      var p = line.split("|").map(function (s) { return s.trim(); });
      if (!p[0]) return null;
      return { title: p[0], lessons: parseInt(p[1], 10) || 0, time: p[2] || "" };
    }).filter(Boolean);
    return {
      id: isNew ? (v("f-id").trim() || slugify(v("f-title"))) : courses[selected].id,
      title: v("f-title").trim(),
      shortDescription: v("f-short").trim(),
      description: v("f-desc").trim(),
      category: v("f-category").trim(),
      level: v("f-level").trim(),
      instructor: { name: v("f-iname").trim(), role: v("f-irole").trim(), initials: (v("f-iinit").trim() || initialsOf(v("f-iname"))) },
      price: parseFloat(v("f-price")) || 0,
      duration: v("f-duration").trim(),
      lessons: parseInt(v("f-lessons"), 10) || 0,
      cover: v("f-cover").trim(),
      telegram: v("f-telegram").trim(),
      gradient: "linear-gradient(135deg, #141414, #2a2a2a)",
      learn: learn,
      modules: modules
    };
  }

  function goList() { selected = -1; isNew = false; msg(""); render(); }

  function bind() {
    var tp = document.getElementById("tab-painel");
    if (tp) tp.addEventListener("click", function () { tab = "painel"; msg(""); if (!stats) loadStats(); else render(); });
    var ta = document.getElementById("tab-alunos");
    if (ta) ta.addEventListener("click", function () { tab = "alunos"; msg(""); if (!stats) loadStats(); else render(); });
    var dr = document.getElementById("dash-refresh");
    if (dr) dr.addEventListener("click", function () { stats = null; render(); loadStats(); });
    var aq = document.getElementById("al-q");
    if (aq) aq.addEventListener("input", function () {
      alunoQ = aq.value;
      document.getElementById("al-list").innerHTML = alunosRowsHTML();
    });
    var t1 = document.getElementById("tab-cursos");
    if (t1) t1.addEventListener("click", function () { tab = "cursos"; msg(""); render(); });
    var t2 = document.getElementById("tab-acesso");
    if (t2) t2.addEventListener("click", function () { tab = "acesso"; msg(""); render(); });

    // Busca: atualiza só a lista, sem perder o foco do campo
    var q = document.getElementById("adm-q");
    if (q) q.addEventListener("input", function () {
      query = q.value;
      document.getElementById("adm-list").innerHTML = listHTML();
      bindItems();
    });
    bindItems();

    var nw = document.getElementById("btn-new");
    if (nw) nw.addEventListener("click", function () { tab = "cursos"; isNew = true; selected = -1; msg(""); render(); });

    var cancel = document.getElementById("btn-cancel");
    if (cancel) cancel.addEventListener("click", goList);
    var cancel2 = document.getElementById("btn-cancel2");
    if (cancel2) cancel2.addEventListener("click", goList);

    var apply = document.getElementById("btn-apply");
    if (apply) apply.addEventListener("click", function () {
      var c = readForm();
      if (!c.title) return msg("Informe o título do curso.", "err");
      if (!c.id || !/^[a-z0-9-]{3,60}$/.test(c.id)) return msg("Identificador inválido. Use letras minúsculas, números e hífen (3 a 60 caracteres).", "err");
      if (isNew && courses.some(function (x) { return x.id === c.id; })) return msg("Já existe um curso com este identificador.", "err");
      if (isNew) { courses.push(c); selected = courses.length - 1; }
      else { courses[selected] = c; }
      isNew = false;
      selected = -1;
      render();
      // Publica na hora: o curso aparece no site assim que você aplica
      document.getElementById("btn-save").click();
    });

    var del = document.getElementById("btn-delete");
    if (del) del.addEventListener("click", function () {
      if (courses.length <= 1) return msg("O site precisa ter pelo menos um curso.", "err");
      if (!window.confirm("Excluir este curso? Ele some do site ao salvar.")) return;
      courses.splice(selected, 1);
      selected = -1;
      render();
      msg("Curso removido. Clique em Salvar no site para publicar.", "ok");
    });

    // Identificador: preenche sozinho com o título, até o admin digitar um próprio
    var ft = document.getElementById("f-title");
    var fi = document.getElementById("f-id");
    if (ft && fi && !fi.disabled) {
      ft.addEventListener("input", function () {
        if (!fi.getAttribute("data-touched")) fi.value = slugify(ft.value);
      });
      fi.addEventListener("input", function () { fi.setAttribute("data-touched", "1"); });
    }

    // Capa: envia o arquivo escolhido e preenche o caminho automaticamente
    var up = document.getElementById("btn-upload");
    if (up) up.addEventListener("click", function () {
      var input = document.getElementById("f-file");
      var cmsg = document.getElementById("f-cover-msg");
      if (!input.files || !input.files[0]) { cmsg.textContent = "Escolha uma imagem primeiro."; cmsg.style.color = "#b91c1c"; return; }
      var fd = new FormData();
      fd.append("file", input.files[0]);
      up.disabled = true;
      up.textContent = "Enviando...";
      fetch("api/upload.php", { method: "POST", credentials: "same-origin", body: fd })
        .then(function (res) { return res.json(); })
        .then(function (r) {
          up.disabled = false;
          up.textContent = "Enviar imagem da capa";
          if (r.ok) {
            document.getElementById("f-cover").value = r.path;
            var pv = document.getElementById("f-preview");
            pv.src = r.path + "?v=" + Date.now();
            pv.style.display = "block";
            cmsg.textContent = "Capa enviada. Clique em Aplicar no curso para guardar.";
            cmsg.style.color = "#1f7a3a";
          } else {
            cmsg.textContent = r.error || "Não foi possível enviar a imagem.";
            cmsg.style.color = "#b91c1c";
          }
        })
        .catch(function () {
          up.disabled = false;
          up.textContent = "Enviar imagem da capa";
          cmsg.textContent = "Sem conexão com o servidor. Tente de novo.";
          cmsg.style.color = "#b91c1c";
        });
    });

    // Liberar acesso de aluno: escolhe o plano e, se for um curso, o curso
    var acPlan = document.getElementById("ac-plan");
    var acWrap = document.getElementById("ac-course-wrap");
    if (acPlan && acWrap) {
      var syncPlan = function () { acWrap.style.display = acPlan.value === "curso" ? "" : "none"; };
      acPlan.addEventListener("change", syncPlan);
      syncPlan();
    }
    var acBtn = document.getElementById("btn-access");
    if (acBtn) acBtn.addEventListener("click", function () {
      var out = document.getElementById("ac-msg");
      var email = document.getElementById("ac-email").value.trim();
      var plan = acPlan.value;
      var course = document.getElementById("ac-course").value;
      out.className = "adm-msg";
      if (!email) { out.textContent = "Informe o e-mail do aluno."; out.classList.add("err"); return; }
      if (!window.confirm("Liberar " + (plan === "todos" ? "todos os cursos" : "o curso escolhido") + " para " + email + "?")) return;
      acBtn.disabled = true;
      fetch("api/access.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ email: email, plan: plan, course: course })
      }).then(function (res) { return res.json().then(function (j) { return { status: res.status, body: j }; }); })
        .then(function (r) {
          acBtn.disabled = false;
          if (r.body && r.body.ok) {
            out.textContent = "Acesso liberado para " + r.body.email + ".";
            out.classList.add("ok");
          } else {
            out.textContent = (r.body && r.body.error) || "Não foi possível liberar o acesso.";
            out.classList.add("err");
          }
        })
        .catch(function () {
          acBtn.disabled = false;
          out.textContent = "Sem conexão com o servidor. Tente de novo.";
          out.classList.add("err");
        });
    });

    var save = document.getElementById("btn-save");
    if (save) save.addEventListener("click", function () {
      save.disabled = true;
      msg("Salvando...", "");
      fetch("api/courses.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ courses: courses })
      }).then(function (res) {
        return res.json().then(function (j) { return { status: res.status, body: j }; });
      }).then(function (r) {
        save.disabled = false;
        if (r.body && r.body.ok) {
          courses = r.body.courses;
          selected = -1; isNew = false;
          render();
          loadStats();
          msg("Salvo. O site já mostra as alterações (pode ser preciso recarregar a página).", "ok");
        } else {
          msg(r.status === 403
            ? "Sua sessão expirou. Recarregue a página e entre de novo para salvar."
            : ((r.body && r.body.error) || "Não foi possível salvar."), "err");
        }
      }).catch(function () {
        save.disabled = false;
        msg("Sem conexão com o servidor. Tente de novo.", "err");
      });
    });
  }

  function bindItems() {
    root.querySelectorAll(".adm-item").forEach(function (b) {
      b.addEventListener("click", function () {
        selected = parseInt(b.getAttribute("data-i"), 10);
        isNew = false;
        msg("");
        render();
      });
    });
  }

  function enter() {
    courses = (window.COURSES || []).map(function (c) { return JSON.parse(JSON.stringify(c)); });
    render();
    loadStats();
  }

  // Login próprio do administrador (não passa pela tela de entrar do site)
  function showLogin(note) {
    root.innerHTML =
      '<div class="adm-card adm-restricted" style="text-align:left">' +
        '<h1 style="margin:0 0 6px">Login do administrador</h1>' +
        '<p style="color:var(--muted);margin:0 0 18px">Entre com a conta de administrador para acessar o painel.</p>' +
        '<p id="adm-login-msg" class="adm-msg err" role="alert">' + esc(note || "") + "</p>" +
        '<form id="adm-login" style="display:grid;gap:14px">' +
          '<div class="adm-field"><label for="a-email">E-mail</label><input id="a-email" type="email" autocomplete="username" required></div>' +
          '<div class="adm-field"><label for="a-pass">Senha</label><input id="a-pass" type="password" autocomplete="current-password" required></div>' +
          '<button type="submit" class="btn btn-primary btn-block" id="a-submit">Entrar no painel</button>' +
        "</form>" +
      "</div>";
    document.getElementById("adm-login").addEventListener("submit", function (e) {
      e.preventDefault();
      var btn = document.getElementById("a-submit");
      var out = document.getElementById("adm-login-msg");
      btn.disabled = true;
      btn.textContent = "Aguarde...";
      fetch("api/auth.php?action=login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({
          email: document.getElementById("a-email").value,
          password: document.getElementById("a-pass").value
        })
      }).then(function (res) { return res.json(); })
        .then(function (r) {
          if (r.ok && r.user && r.user.role === "admin") { enter(); return; }
          out.textContent = r.ok ? "Esta conta não tem acesso de administrador." : (r.error || "Não foi possível entrar.");
          btn.disabled = false;
          btn.textContent = "Entrar no painel";
        })
        .catch(function () {
          out.textContent = "Sem conexão com o servidor. Tente de novo.";
          btn.disabled = false;
          btn.textContent = "Entrar no painel";
        });
    });
  }

  // Abre o painel se já houver sessão de admin; senão mostra o login do administrador
  fetch("api/auth.php?action=me", { credentials: "same-origin" })
    .then(function (res) { return res.json(); })
    .then(function (r) {
      if (r.ok && r.user && r.user.role === "admin") { enter(); return; }
      showLogin("");
    })
    .catch(function () { showLogin("Não foi possível verificar o acesso. Recarregue a página."); });
})();
</script>
</body>
</html>
